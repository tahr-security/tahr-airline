name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: local
  PROJECT_NAME: Tahr Air
  FRONTEND_HOST: http://localhost:8000
  BACKEND_CORS_ORIGINS: http://localhost:8000
  SECRET_KEY: ci-only-secret-key-not-for-production
  FIRST_SUPERUSER: wardenn-admin@tahr.ca
  FIRST_SUPERUSER_PASSWORD: ci-only-admin-password
  POSTGRES_DB: tahr_air_test
  POSTGRES_USER: tahr_air
  POSTGRES_PASSWORD: ci-only-database-password
  TAHR_AIR_IMAGE: tahr-airline:ci

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: tahr_air_test
          POSTGRES_USER: tahr_air
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tahr_air -d tahr_air_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-packages
      - name: Verify migration round trip
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed database
        working-directory: backend
        run: uv run python app/initial_data.py
      - name: Lint and type-check backend
        working-directory: backend
        run: uv run bash scripts/lint.sh
      - name: Test backend
        working-directory: backend
        run: |
          uv run coverage run -m pytest tests
          uv run coverage report --fail-under=85

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true ./
      - name: Type-check and build frontend
        working-directory: frontend
        run: bun run build

  generated-client:
    name: Generated API client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          cache-dependency-glob: uv.lock
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages
          bun install --frozen-lockfile
      - name: Regenerate OpenAPI client
        run: bun run generate-client
      - name: Check generated files are current
        run: git diff --exit-code -- frontend/openapi.json frontend/src/client

  browser-and-container:
    name: Browser and container
    needs: [backend, frontend, generated-client]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend and Chromium
        run: |
          bun install --frozen-lockfile
          cd frontend
          bunx playwright install --with-deps chromium
      - name: Build hardened image
        run: docker compose -f compose.production.yml build app
      - name: Start stack
        run: docker compose -f compose.production.yml up -d --wait
      - name: Smoke test runtime constraints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/utils/health-check/
          test "$(docker compose -f compose.production.yml exec -T app id -u)" = "10001"
          test "$(docker image inspect -f '{{.Architecture}}' "$TAHR_AIR_IMAGE")" = "amd64"
          ! docker compose -f compose.production.yml exec -T app touch /app/read-only-check
          docker compose -f compose.production.yml exec -T app sh -c 'touch /tmp/write-check && rm /tmp/write-check'
          for service in app prestart db; do
            container="$(docker compose -f compose.production.yml ps -aq "$service")"
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
            test "$(docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$container")" = '["no-new-privileges:true"]'
            test "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$container")" = '["ALL"]'
            test "$(docker inspect -f '{{json .HostConfig.Tmpfs}}' "$container")" != '{}'
          done
          test -z "$(docker port "$(docker compose -f compose.production.yml ps -q db)")"
      - name: Test browser journeys
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: bunx playwright test
      - name: Verify restart persistence
        run: |
          docker compose -f compose.production.yml restart db app
          docker compose -f compose.production.yml up -d --wait app
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/utils/health-check/
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Show container logs
        if: failure()
        run: docker compose -f compose.production.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans
